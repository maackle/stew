[package]
name = "stew"
version = "0.1.0"
edition = "2021"
description = "Stewardship linter: maps .stew files to code ownership over a file tree"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
